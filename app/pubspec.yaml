name: puzzles
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.2.1
  intl: any
  module_rebus:
    path: ../packages/module_rebus
  module_rebus_ui:
    path: ../packages/module_rebus_ui
  module_digit_rebus_ui:
    path: ../packages/module_digit_rebus_ui
  module_domino_ui:
    path: ../packages/module_domino_ui
  module_labyrinth:
    path: ../packages/module_labyrinth
  module_labyrinth_ui:
    path: ../packages/module_labyrinth_ui
  module_squareword:
    path: ../packages/module_squareword
  module_squareword_ui:
    path: ../packages/module_squareword_ui
  path_provider: ^2.1.6
  puzzle_core:
    path: ../packages/core
  window_manager: ^0.5.2
  file_picker: ">=10.1.0 <11.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sfx/
    - assets/icons/

resolution: workspace
