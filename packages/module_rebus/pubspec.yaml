name: module_rebus
description: The "rebus" arithmetic-square puzzle module — model, evaluator, verifier, solver, and puzzle data. Flutter UI is added in M2.
publish_to: none
resolution: workspace
environment:
  sdk: ^3.5.0

dependencies:
  puzzle_core:
    path: ../core

dev_dependencies:
  test: ^1.25.0

# Consumed by Flutter apps that depend on this package (e.g. module_rebus_ui)
# so the puzzle data bundles as an asset. Pure-Dart tooling (`dart test`,
# `dart analyze`) ignores this section.
flutter:
  assets:
    - assets/puzzles/
