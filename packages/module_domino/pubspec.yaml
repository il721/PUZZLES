name: module_domino
description: The "domino solitaire" puzzle module - model, value-constrained tiling solver, and puzzle data. Flutter UI is added in a later milestone.
publish_to: none
resolution: workspace
environment:
  sdk: ^3.5.0

dev_dependencies:
  test: ^1.25.0

# Consumed by Flutter apps that depend on this package (e.g.
# module_domino_ui) so the puzzle data bundles as an asset. Pure-Dart
# tooling (`dart test`, `dart analyze`) ignores this section.
flutter:
  assets:
    - assets/puzzles/
