name: module_playground
description: The "Головоломки-игры" playground module - a container of seven small, unrelated play-puzzles; contract, engines, puzzle data and solvers. Flutter UI is added in a later milestone.
publish_to: none
resolution: workspace
environment:
  sdk: ^3.5.0

dev_dependencies:
  test: ^1.25.0

# Consumed by Flutter apps that depend on this package (e.g.
# module_playground_ui) so the puzzle data bundles as an asset. Pure-Dart
# tooling (`dart test`, `dart analyze`) ignores this section.
flutter:
  assets:
    - assets/puzzles/
