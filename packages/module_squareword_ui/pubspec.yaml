name: module_squareword_ui
description: Flutter UI for the "squareword" (Сквэрворды) puzzle module — tap-to-place NxN grid rendering with a letter-picker popup, live row/column/diagonal violation highlighting, puzzle screen/list, and session persistence.
publish_to: none
resolution: workspace
environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  module_squareword:
    path: ../module_squareword
  puzzle_core:
    path: ../core

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
